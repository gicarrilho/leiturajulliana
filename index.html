<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julliana Marques · Leitura de Marca</title>
<meta name="description" content="A Leitura de Marca de Julliana Marques. O manifesto, o guia de marca e o lugar onde a marca vira conteúdo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23331319'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' font-weight='bold' fill='%23C9A227' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#331319">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400..600&family=Archivo:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=20260925">
</head>
<body class="casa">

<i id="prog" aria-hidden="true"></i>
<main id="main"></main>

<script src="comum.js?v=20260925"></script>
<script>
comDados(function(){

window.CASA = "Leitura de Marca";

/* ===== 1 · O MANIFESTO. É a primeira coisa que ela vê. ===== */
folha("tinta mf-folha noite",
  '<div class="assina">'+
    '<span class="nome">'+esc(MARCA.cliente)+'</span>'+
    '<span class="prod">'+esc(MARCA.produto)+'</span>'+
  '</div>'+
  '<div class="mf"><div class="mf-rot">'+esc(MANIFESTO.rot)+'</div>'+
  MANIFESTO.blocos.map(function(b){
    if(b.n==="p") return '<div class="mf-p'+(b.g?" "+b.g:"")+'"></div>';
    if(b.n==="fim") return '<div class="mf-fim">'+b.t.split("\n\n").map(function(x){
      return '<p>'+br(x)+'</p>'}).join("")+'</div>';
    return '<p class="mf-'+b.n+'">'+br(b.t)+'</p>';
  }).join("")+'</div>','manifesto');

/* ===== 2 · OS DOIS CAMINHOS ===== */
var PORTAS = [
  { n:"01", nome:"O seu Guia de Marca", href:"marca.html",
    ds:"O que reconhecemos sobre você nos nossos encontros. É para ler com calma, uma vez, e voltar sempre que precisar lembrar de quem você é ou de por que decidimos alguma coisa.",
    itens:["De onde partimos","A essência","Em 1 minuto","Território","Princípios","Suas frentes","Manual","Arquétipos","Cliente ideal"],
    vai:"Entrar no guia →" },
  { n:"02", nome:"A sua marca em forma de conteúdo", href:"conteudo.html", quente:true,
    ds:"É onde a marca vira trabalho. Pautas prontas, ferramentas para criar, a régua para conferir antes de publicar e o plano dos primeiros trinta dias.",
    itens:["Pilares","Banco de pautas","Da cena ao conteúdo","A régua","Plano de 30 dias","Repertório"],
    vai:"Entrar no conteúdo →" }
];

folha("areia caminhos",
  '<div class="rot-ed">por onde seguir</div>'+
  '<h2>Daqui saem dois caminhos.</h2>'+
  '<p class="intro">O primeiro é para se reconhecer. O segundo é para trabalhar. Você não precisa escolher um: o segundo só faz sentido depois do primeiro, mas depois disso você vai voltar muito mais ao segundo.</p>'+
  '<div class="cxs c2" style="margin-top:clamp(20px,2.6vw,34px)">'+
  PORTAS.map(function(p){
    return '<a class="cx cx-porta'+(p.quente?" quente":"")+'" href="'+at(p.href)+'">'+
      '<span class="np">'+esc(p.n)+'</span>'+
      '<span class="nm">'+br(p.nome)+'</span>'+
      '<p class="ds">'+br(p.ds)+'</p>'+
      '<span class="itens">'+p.itens.map(function(i){return '<span>'+esc(i)+'</span>'}).join("")+'</span>'+
      '<span class="vai">'+esc(p.vai)+'</span>'+
    '</a>';
  }).join("")+'</div>'+
  '<div class="rodape-casa">'+
    '<span><b>'+esc(CONSULTORA.nome)+'</b> · '+esc(CONSULTORA.assinatura)+'</span>'+
    '<span>'+esc(CONSULTORA.instagram)+'</span>'+
    '<a href="'+at(CONSULTORA.whatsapp)+'" target="_blank" rel="noopener">Falar com a Gi</a>'+
  '</div>','caminhos');

montar();
animacoes();

/* barra de progresso, sem o resto da navegação */
var barra=$("#prog"), tick=false;
function progresso(){
  var h=document.documentElement.scrollHeight-window.innerHeight;
  barra.style.transform="scaleX("+(h>0?Math.min(window.scrollY/h,1):0)+")";
  tick=false;
}
window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(progresso)}},{passive:true});
window.addEventListener("resize",progresso); progresso();

try{ MEM.registrarVisita(); }catch(e){}

});
</script>
</body>
</html>
